name: Build H5P package

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ctezlifrn/h5p-cli:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build package
        run: npx h5p pack src H5P.CustomCSS-1.1.h5p

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: H5P.CustomCSS-1.1.h5p
          path: H5P.CustomCSS-1.1.h5p
